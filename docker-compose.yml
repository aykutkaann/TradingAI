# Spin everything up:   docker compose up --build
# Tear down:            docker compose down
# Reset DB volume too:  docker compose down -v
#
# Secrets (Grok key, Mailtrap creds, JWT secret) come from a `.env` file
# at the repo root. Copy `.env.example` to `.env` and fill it in.
#
# After everything is up:
#   - Frontend: http://localhost:5173
#   - API:      http://localhost:8080  (Swagger at /swagger in dev)
#   - Postgres: localhost:5432  (postgres / admin)
#   - Redis:    localhost:6379

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tradingai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradingai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # Connection strings — note the double-underscore mapping for nested keys.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tradingai;Username=postgres;Password=admin"
      ConnectionStrings__Redis: "redis:6379"

      # CORS — let the dockerized frontend AND the local Vite dev server reach the API.
      Cors__AllowedOrigins__0: "http://localhost"
      Cors__AllowedOrigins__1: "http://localhost:3000"
      Cors__AllowedOrigins__2: "http://localhost:5173"
      Cors__AllowedOrigins__3: "http://localhost:8080"

      # JWT — secret comes from .env (gitignored).
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "TradingAI"
      Jwt__Audience: "TradingAI.Client"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"

      # Grok / xAI (or Groq, depending on the BaseUrl you pick)
      Grok__ApiKey: "${GROK_API_KEY}"
      Grok__Model: "${GROK_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}"
      Grok__BaseUrl: "${GROK_BASE_URL:-https://api.groq.com/openai/v1}"
      Grok__MaxTokens: "2048"

      # TwelveData (forex / commodities / stocks history)
      TwelveData__ApiKey: "${TWELVEDATA_API_KEY}"

      # Outcome worker
      OutcomeTracking__PollIntervalMinutes: "5"
      OutcomeTracking__BatchSize: "100"
      OutcomeTracking__DefaultExpiryDays: "7"

      # Email (Mailtrap sandbox by default)
      Email__Host: "${EMAIL_HOST:-sandbox.smtp.mailtrap.io}"
      Email__Port: "${EMAIL_PORT:-2525}"
      Email__Username: "${EMAIL_USERNAME}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__FromEmail: "${EMAIL_FROM:-noreply@tradingai.dev}"
      Email__FromName: "TradingAI"
      Email__UseSsl: "false"

  web:
    build:
      context: ./tradingai-web
      dockerfile: Dockerfile
      args:
        # Browser hits the API on the host machine, not inside the docker network,
        # so the URL must be the host-mapped port.
        VITE_API_URL: "http://localhost:8080"
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
